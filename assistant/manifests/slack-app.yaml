# Create the Slack app from this manifest: api.slack.com/apps → Create New App → From a manifest.
display_information:
  name: Pip
  description: Your IT helper. Routes requests to SFIA role agents.
  background_color: "#0f6e64"
features:
  bot_user:
    display_name: Pip
    always_online: true
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot: [app_mentions:read, chat:write, im:history, im:read, im:write, users:read]
settings:
  event_subscriptions:
    bot_events: [app_mention, message.im]
  interactivity:
    is_enabled: true
  socket_mode_enabled: true
